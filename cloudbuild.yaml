# ══════════════════════════════════════════════════════════════════════
# mForceAnatomist — CANONICAL mForce CI/CD PIPELINE (15 steps)
#
# GENERATED by cicd-standardize.sh — do not hand-edit step structure.
# Change the template, re-run the generator. Every fleet repo has these
# same 15 ids in this same order. A step that does not apply to this app
# still runs and says so, so the pipeline shape never drifts again.
#
#   app=mForceAnatomist  project=mforceanatomist  service=mforceanatomist  db=mforce_anatomist  user=mforceanatomist  kind=image
# ══════════════════════════════════════════════════════════════════════
substitutions:
  _APP: 'mForceAnatomist'
  _PROJECT: 'mforceanatomist'
  _SERVICE: 'mforceanatomist'
  _REGION: 'us-east1'
  _DB_HOST: '10.97.0.2'
  _DB_NAME: 'mforce_anatomist'
  _DB_USER: 'mforceanatomist'
  _IMAGE: 'us-east1-docker.pkg.dev/mforceanatomist/cloud-run-source-deploy/mforceanatomist'
  _VPC_NET: 'projects/mforce-os/global/networks/mforce-os-vpc'
  _VPC_SUB: 'projects/mforce-os/regions/us-east1/subnetworks/mforce-os-subnet'

steps:

# ── Step 01 RESOLVE ───────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-01-RESOLVE'
  entrypoint: bash
  args:
    - '-c'
    - |
      set -e
      echo "[${_APP}] Step 01 RESOLVE — locating version directory"
      V=$$(ls -d ${_APP}_v[0-9]*/ 2>/dev/null | sed 's#/##' | sort -V | tail -1)
      [ -n "$$V" ] || { echo "FATAL: no ${_APP}_v* directory"; exit 1; }
      ln -sfn "$$V" current
      echo "[${_APP}] Step 01 RESOLVE — building $$V via ./current"

# ── Step 02 PREFLIGHT — secrets must exist AND be readable by this SA ──
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-02-PREFLIGHT'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 02 PREFLIGHT — required secrets"
      FAIL=0
      for S in mforceanatomist-db-password mforceanatomist-perimeter-secret; do
        if gcloud secrets versions access latest --secret=$$S --project=${_PROJECT} >/dev/null 2>&1; then
          echo "  ok       $$S"
        else
          echo "  MISSING  $$S  (or this build SA cannot read it)"
          echo "    fix: gcloud secrets add-iam-policy-binding $$S --project=${_PROJECT} \\"
          echo "         --member=serviceAccount:$$(gcloud projects describe ${_PROJECT} --format='value(projectNumber)')@cloudbuild.gserviceaccount.com \\"
          echo "         --role=roles/secretmanager.secretAccessor"
          FAIL=1
        fi
      done
      [ $$FAIL = 0 ] || exit 1
      echo "[${_APP}] Step 02 PREFLIGHT — all required secrets readable"

# ── Step 03 INFRA — provisioned? ──────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-03-INFRA'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 03 INFRA — verifying infrastructure"
      gcloud artifacts repositories describe cloud-run-source-deploy \
        --location=${_REGION} --project=${_PROJECT} >/dev/null 2>&1 \
        && echo "  ok       artifact registry" \
        || { echo "  creating artifact registry"; gcloud artifacts repositories create cloud-run-source-deploy \
             --repository-format=docker --location=${_REGION} --project=${_PROJECT} --quiet || true; }
      echo "  db target ${_DB_USER}@${_DB_HOST}/${_DB_NAME} (proved live at Step 11)"
      echo "[${_APP}] Step 03 INFRA — ok"

# ── Step 04 DB-PRECHECK — fail in SECONDS, not after build+push+deploy ─
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-04-DB-PRECHECK'
  entrypoint: bash
  args:
    - '-c'
    - |
      if [ "y" != "y" ]; then
        echo "[${_APP}] Step 04 DB-PRECHECK — not required for ${_APP}: no database"
        exit 0
      fi
      echo "[${_APP}] Step 04 DB-PRECHECK — validating DB identity before any expensive work"
      FAIL=0
      ST=$$(gcloud alloydb instances describe primary --cluster fluxive-db-cluster \
            --region us-east1 --project mforce-os --format='value(state)' 2>/dev/null)
      if [ "$$ST" = "READY" ]; then echo "  ok       instance READY"
      else echo "  FATAL    AlloyDB instance state='$$ST' (expected READY)"; FAIL=1; fi
      ROLES=$$(gcloud alloydb users list --cluster fluxive-db-cluster --region us-east1 \
               --project mforce-os --format='value(name.basename())' 2>&1); RC=$$?
      if [ "$$RC" != "0" ] || [ -z "$$ROLES" ]; then
        echo "  CANNOT VERIFY — this build cannot LIST AlloyDB roles in mforce-os."
        echo "           reason: $$(printf '%s' "$$ROLES" | head -1 | cut -c1-120)"
        echo "           This is NOT proof the role is missing — it is proof we could not ask."
        echo "           fix: bash grant-alloydb-viewer.sh   (grants roles/alloydb.viewer on mforce-os)"
        echo "           Continuing — Step 12 VERIFY-DB still proves the connection for real."
      elif printf '%s' "$$ROLES" | grep -qx "${_DB_USER}"; then
        echo "  ok       role ${_DB_USER} exists in the cluster"
      else
        echo "  FATAL    role '${_DB_USER}' does NOT exist in fluxive-db-cluster"
        echo "           Postgres folds identifiers: mForceBridge != mforcebridge."
        echo "           roles present:"
        printf '%s\n' "$$ROLES" | sed 's/^/             /'
        FAIL=1
      fi
      if [ "${_DB_USER}" = "postgres" ]; then
        echo "  FATAL    ${_APP} is deploying as the shared superuser 'postgres'."
        echo "           Every system must use its own mforce<system> role."
        FAIL=1
      fi
      [ "$$FAIL" = 0 ] || { echo "[${_APP}] Step 04 DB-PRECHECK — FAILED before spending a build"; exit 1; }
      echo "[${_APP}] Step 04 DB-PRECHECK — identity valid (grants proved live at Step 12)"

# ── Step 05 DEPS ──────────────────────────────────────────────────────
- name: 'node:20'
  id: 'Step-05-DEPS'
  entrypoint: bash
  args:
    - '-c'
    - |
      if [ -f current/package.json ]; then
        echo "[${_APP}] Step 05 DEPS — npm install"
        cd current && npm install --legacy-peer-deps
      else
        echo "[${_APP}] Step 05 DEPS — not required for ${_APP}: no package.json"
      fi

# ── Step 06 TEST ──────────────────────────────────────────────────────
- name: 'node:20'
  id: 'Step-06-TEST'
  entrypoint: bash
  args:
    - '-c'
    - |
      if [ -f current/package.json ] && grep -q '"test"' current/package.json; then
        echo "[${_APP}] Step 06 TEST — npm test"
        cd current && npm test
      else
        echo "[${_APP}] Step 06 TEST — not required for ${_APP}: no test script defined"
      fi

# ── Step 07 GUARDS — security posture + deploy hash ───────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-07-GUARDS'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 07 GUARDS — security checks"
      if grep -rn "mforce-perimeter-v1-default-key" current/ --include=*.js 2>/dev/null | grep -v node_modules; then
        echo "  FATAL: forgeable hardcoded perimeter default key present"; exit 1
      fi
      echo "  ok       no hardcoded perimeter default"
      H=$$(find current/ -type f \( -name '*.js' -o -name '*.ts' -o -name '*.py' -o -name '*.dart' \) \
           ! -path '*/node_modules/*' ! -path '*/build/*' | sort | xargs cat 2>/dev/null | sha256sum | awk '{print $$1}')
      echo "$$H" > /workspace/.deploy-hash
      date -u +%Y-%m-%d-%H%M%S > /workspace/_rev.txt
      date -u +%Y.%m.%d_%H%M%S > /workspace/_tag.txt
      echo "  hash     $$H"

# ── Step 08 MIGRATE ───────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-08-MIGRATE'
  entrypoint: bash
  args:
    - '-c'
    - |
      # protocols/mForceOS1_db-migration-protocol.md: "A code deploy never
      # migrates the DB". This step REPORTS; it does not apply. It used to look
      # at current/migrations — a path no app uses — and, on the branch it could
      # never reach, claim migrations were "applied by the app at boot". No app
      # in this fleet has a boot migration runner, so that message was false as
      # well as against the standard.
      if [ -d current/db/migrations ]; then
        N=$$(ls current/db/migrations/*.sql 2>/dev/null | wc -l | tr -d ' ')
        echo "[${_APP}] Step 08 MIGRATE — $$N migration file(s) present. THIS PIPELINE DOES NOT APPLY THEM."
        ls current/db/migrations | head -10 | sed 's/^/    /'
        # Name the runner that EXISTS. This line used to read
        # "bash _scripts/mforce-migrate.sh ${_APP}" — no such script at the fleet root,
        # and the one app that has a file by that name takes a migrations DIRECTORY,
        # not an app name. The real fleet client is _scripts/mf-migrate.sh: it drives
        # the migration through mForceScience, the only service with a proven SQL route
        # to AlloyDB on 10.97.0.2 (neither Cloud Build nor a laptop can reach it), and
        # lands in the same audit trail as the console.
        echo "[${_APP}]   apply out of band — plan first, then apply:"
        echo "[${_APP}]       bash _scripts/mf-migrate.sh ${_APP} plan"
        echo "[${_APP}]       bash _scripts/mf-migrate.sh ${_APP} apply --apply"
        if [ -f current/cloudbuild.migrate.yaml ]; then
          echo "[${_APP}]   or in-VPC, as its own DATABASE pipeline (Cloud Run Job on the VPC connector):"
          echo "[${_APP}]       gcloud builds submit --config cloudbuild.migrate.yaml --substitutions=_MODE=apply --project=${_PROJECT}"
        fi
        echo "[${_APP}]   a deploy that assumes they ran will query columns that do not exist."
      else
        echo "[${_APP}] Step 08 MIGRATE — no db/migrations directory in ${_APP}; nothing to report"
      fi

# ── Step 09 BUILD-IMAGE ───────────────────────────────────────────────
- name: 'gcr.io/cloud-builders/docker'
  id: 'Step-09-BUILD-IMAGE'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 09 BUILD-IMAGE — docker build"
      TAG=$$(cat /workspace/_tag.txt)
      docker build -t ${_IMAGE}:$$TAG -t ${_IMAGE}:latest current

# ── Step 10 PUSH-IMAGE ────────────────────────────────────────────────
- name: 'gcr.io/cloud-builders/docker'
  id: 'Step-10-PUSH-IMAGE'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 10 PUSH-IMAGE — pushing to Artifact Registry"
      docker push --all-tags ${_IMAGE}

# ── Step 11 DEPLOY — dark canary, 0% traffic ──────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-11-DEPLOY'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 11 DEPLOY — dark canary at 0% traffic"
      REV=$$(cat /workspace/_rev.txt); TAG=$$(cat /workspace/_tag.txt)
      HASH=$$(cat /workspace/.deploy-hash)
      # --update-secrets takes ENV_VAR=SECRET:VERSION. Without the "DB_PASSWORD="
      # key gcloud rejects it as "Bad syntax for dict arg" and no canary is created.
      SEC="DB_PASSWORD=mforceanatomist-db-password:latest"
      gcloud secrets versions access latest --secret=mforceanatomist-perimeter-secret --project=${_PROJECT} >/dev/null 2>&1 \
        && SEC="$$SEC,PERIMETER_SECRET=mforceanatomist-perimeter-secret:latest"
      SRC="--image ${_IMAGE}:$$TAG"
      EXISTS=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --project ${_PROJECT} >/dev/null 2>&1 && echo y || echo n)
      TRAFFIC=""; [ "$$EXISTS" = y ] && TRAFFIC="--no-traffic --tag canary"
      gcloud run deploy ${_SERVICE} $$SRC \
        --region ${_REGION} --project ${_PROJECT} \
        --ingress=all \
        --network=${_VPC_NET} --subnet=${_VPC_SUB} --vpc-egress=private-ranges-only \
        --revision-suffix=$$REV $$TRAFFIC \
        --update-env-vars="DEPLOY_HASH=$$HASH,DEPLOY_PIPELINE=cloud-build,DB_HOST=${_DB_HOST},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER}" \
        --update-secrets="$$SEC" --quiet \
        || { echo "[${_APP}] Step 11 DEPLOY — FATAL: gcloud run deploy failed. No canary exists."; exit 1; }
      echo "[${_APP}] Step 11 DEPLOY — canary up, old revision still serving"

# ── Step 12 VERIFY-DB — the canary must PROVE a live DB connection ────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-12-VERIFY-DB'
  entrypoint: bash
  args:
    - '-c'
    - |
      if [ "y" != "y" ]; then
        echo "[${_APP}] Step 12 VERIFY-DB — not required for ${_APP}: no database"
        exit 0
      fi
      echo "[${_APP}] Step 12 VERIFY-DB — canary must prove ${_DB_USER}@${_DB_NAME} is live"
      U=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --project ${_PROJECT} \
           --format=json | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='canary'),''))")
      [ -n "$$U" ] || U=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --project ${_PROJECT} --format='value(status.url)')
      B=$$(curl -s --max-time 25 "$$U/health" || echo "")
      echo "  canary /health -> $$B"
      case "$$B" in
        *'"db":"down"'*|*'"db": "down"'*)
          echo "  FATAL: canary reports DB DOWN. Not promoting."
          echo "    check: DB_USER=${_DB_USER}, secret mforceanatomist-db-password, grants on ${_DB_NAME}"
          exit 1;;
        *'"db"'*)
          echo "[${_APP}] Step 12 VERIFY-DB — canary confirms a live database connection";;
        "")
          echo "  FATAL: canary returned NOTHING — it is not serving. That is an"
          echo "         unreachable canary, not a missing db field. Not promoting."
          exit 1;;
        *Service*Unavailable*|*"503"*)
          echo "  FATAL: canary is deployed but unhealthy ($$B). Not promoting."
          exit 1;;
        *"{"*)
          echo "  WARNING: ${_APP} serves JSON but reports no db field."
          echo "  This pipeline CANNOT verify the database for this app."
          echo "  TODO: add a db field to /health (see mForceBridge). Continuing.";;
        *)
          echo "  FATAL: canary /health returned non-JSON ($$B). Cannot verify. Not promoting."
          exit 1;;
      esac

# ── Step 13 SMOKE ─────────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-13-SMOKE'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 13 SMOKE — canary health probe"
      U=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --project ${_PROJECT} \
           --format=json | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='canary'),''))")
      [ -n "$$U" ] || U=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --project ${_PROJECT} --format='value(status.url)')
      for i in 1 2 3; do
        C=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$$U/health" || echo 000)
        echo "  attempt $$i -> HTTP $$C"
        [ "$$C" = "200" ] && { echo "[${_APP}] Step 13 SMOKE — healthy"; exit 0; }
        sleep 10
      done
      echo "  FATAL: canary never returned 200. Old revision keeps serving."; exit 1

# ── Step 14 PROMOTE ───────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-14-PROMOTE'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 14 PROMOTE — swapping traffic to canary"
      gcloud run services update-traffic ${_SERVICE} --to-latest \
        --region ${_REGION} --project ${_PROJECT} --quiet
      gcloud run services update-traffic ${_SERVICE} --remove-tags canary \
        --region ${_REGION} --project ${_PROJECT} --quiet 2>/dev/null || true
      echo "[${_APP}] Step 14 PROMOTE — 100% traffic on the new revision"

# ── Step 15 POSTCHECK — verify PRODUCTION, roll back if bad ───────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-15-POSTCHECK'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 15 POSTCHECK — production after the swap"
      sleep 12
      U=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --project ${_PROJECT} --format='value(status.url)')
      B=$$(curl -s --max-time 25 "$$U/health" || echo "")
      echo "  production /health -> $$B"
      BAD=0
      case "$$B" in *'"db":"down"'*|*'"db": "down"'*) BAD=1;; esac
      [ -z "$$B" ] && BAD=1
      if [ "$$BAD" = 1 ]; then
        echo "  PRODUCTION IS BAD — rolling back to the previous revision"
        PREV=$$(gcloud run revisions list --service ${_SERVICE} --region ${_REGION} \
                --project ${_PROJECT} --sort-by='~creationTimestamp' --format='value(metadata.name)' | sed -n 2p)
        [ -n "$$PREV" ] && gcloud run services update-traffic ${_SERVICE} \
          --to-revisions "$$PREV=100" --region ${_REGION} --project ${_PROJECT} --quiet
        echo "  rolled back to $$PREV"; exit 1
      fi
      echo "[${_APP}] Step 15 POSTCHECK — production verified healthy"

# ── Step 16 LEDGER ────────────────────────────────────────────────────
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Step-16-LEDGER'
  entrypoint: bash
  args:
    - '-c'
    - |
      echo "[${_APP}] Step 16 LEDGER — recording the deploy contract"
      H=$$(cat /workspace/.deploy-hash 2>/dev/null || echo unknown)
      A=$$(gcloud run revisions list --service ${_SERVICE} --region ${_REGION} --project ${_PROJECT} \
           --sort-by='~creationTimestamp' --limit=1 --format='value(metadata.name)')
      printf '{"system":"%s","service":"%s","project":"%s","dbUser":"%s","dbName":"%s","deployHash":"%s","activeRevision":"%s","gitCommit":"%s","buildId":"%s","pipeline":"canonical-15-step","timestamp":"%s"}' \
        "${_APP}" "${_SERVICE}" "${_PROJECT}" "${_DB_USER}" "${_DB_NAME}" \
        "$$H" "$$A" "$COMMIT_SHA" "$BUILD_ID" "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        > /workspace/rollout_contract.json
      curl -s -X POST "https://ledger.fluxive.ai/api/v1/deployments/notify" \
        -H "Content-Type: application/json" -d @/workspace/rollout_contract.json \
        --max-time 10 || echo "  ledger unreachable (non-blocking)"
      echo "[${_APP}] Step 16 LEDGER — done"

images:
  - ${_IMAGE}:latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: 2400s
